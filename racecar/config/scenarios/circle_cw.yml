world:
  name: circle_cw
agents:
  - id: A
    vehicle:
      name: racecar
      sensors: [ lidar, pose, velocity, acceleration ]
    task:
      task_name: maximize_progress
      params: {laps: 1, time_limit: 60.0, terminate_on_collision: True, collision_reward: -3.0, frame_reward: -0.05, progress_reward: 20.0 }
